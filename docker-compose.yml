services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:KodinginSecret2026!@postgres:5432/kodingin}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-super_secret_key_kodingin_production_2026_safe}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://api.kodingin.com}
      - FRONTEND_URL=${FRONTEND_URL:-https://kodingin.com}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-KodinginSecret2026!}
      - POSTGRES_DB=${POSTGRES_DB:-kodingin}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  db_data:
  uploads_data:
